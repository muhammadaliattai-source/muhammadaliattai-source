<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" role="img" aria-label="Oscar">
<defs>
  <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="1" stop-color="#130d2b"/></linearGradient>
  <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="c"><rect width="400" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .fb{transform-box:fill-box;transform-origin:center}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes sh{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
</style>
<g clip-path="url(#c)">
  <rect width="400" height="250" fill="url(#cb)"/>
  <circle cx="350" cy="40" r="80" fill="#22d3ee" opacity=".25" filter="url(#b)"/>
  <rect width="400" height="4" fill="url(#ac)"/>
  <rect x="0" y="0" width="60" height="250" fill="#fff" opacity=".03" transform="skewX(-20)" style="animation:sh 5s ease-in-out infinite"/>
  <g class="fb" style="animation:float 4s ease-in-out infinite">
  <rect x="300" y="26" width="72" height="44" rx="14" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-width="2"/>
  <path d="M312 70 l-4 12 l14 -12z" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="322" cy="48" r="4" fill="#22d3ee" style="animation:pulse 1.2s 0.0s infinite"/><circle cx="336" cy="48" r="4" fill="#22d3ee" style="animation:pulse 1.2s 0.2s infinite"/><circle cx="350" cy="48" r="4" fill="#22d3ee" style="animation:pulse 1.2s 0.4s infinite"/>
  <rect x="318" y="80" width="58" height="34" rx="12" fill="#a855f7" fill-opacity=".2" stroke="#a855f7" stroke-width="2"/>
  <path d="M347 106 c-9 -6 -13 -10 -13 -14 a5 5 0 0 1 13 -3 a5 5 0 0 1 13 3 c0 4 -4 8 -13 14z" fill="#ec4899" style="animation:pulse 1.4s infinite"/></g>
  <text x="24" y="62" class="t" font-size="24" font-weight="800" fill="#f1f5f9">Oscar</text>
  <text x="24" y="88" class="t" font-size="13" font-weight="600" fill="#22d3ee" letter-spacing=".5">FULL-STACK SOCIAL MEDIA APP</text>
  <text x="24" y="124" class="t" font-size="14" fill="#94a3b8">Posts, profiles and real-time chat with</text><text x="24" y="145" class="t" font-size="14" fill="#94a3b8">JWT auth and live messaging.</text>
  <rect x="24" y="178" width="56" height="24" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4"/><text x="52.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#22d3ee">React</text><rect x="88" y="178" width="70" height="24" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4"/><text x="123.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#22d3ee">Express</text><rect x="166" y="178" width="70" height="24" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4"/><text x="201.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#22d3ee">MongoDB</text><rect x="244" y="178" width="84" height="24" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4"/><text x="286.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#22d3ee">Socket.io</text>
  <circle cx="30" cy="226" r="5.5" fill="#f1e05a"/><text x="42" y="230.5" class="t" font-size="13" fill="#cbd5e1">JavaScript</text>
  <text x="376" y="230.5" text-anchor="end" class="t" font-size="13" font-weight="600" fill="#22d3ee">View repo →</text>
</g>
<rect x=".75" y=".75" width="398.5" height="248.5" rx="19.5" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5"/>
</svg>