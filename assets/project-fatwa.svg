<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" role="img" aria-label="Fatwa">
<defs>
  <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="1" stop-color="#130d2b"/></linearGradient>
  <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="c"><rect width="400" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .fb{transform-box:fill-box;transform-origin:center}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes sh{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
</style>
<g clip-path="url(#c)">
  <rect width="400" height="250" fill="url(#cb)"/>
  <circle cx="350" cy="40" r="80" fill="#34d399" opacity=".25" filter="url(#b)"/>
  <rect width="400" height="4" fill="url(#ac)"/>
  <rect x="0" y="0" width="60" height="250" fill="#fff" opacity=".03" transform="skewX(-20)" style="animation:sh 5s ease-in-out infinite"/>
  <g class="fb" style="animation:float 4s ease-in-out infinite">
  <g transform="translate(340 66) rotate(40)">
    <path d="M0 -40 C16 -24 16 6 10 20 H-10 C-16 6 -16 -24 0 -40Z" fill="#e2e8f0"/>
    <circle cx="0" cy="-12" r="7" fill="#34d399" stroke="#0b1226" stroke-width="3"/>
    <path d="M-10 6 L-22 22 L-10 18Z M10 6 L22 22 L10 18Z" fill="#34d399"/>
    <path d="M-6 22 Q0 44 6 22Z" fill="#fbbf24" style="animation:pulse .4s infinite"/>
  </g>
  <circle cx="296" cy="30" r="2" fill="#fff" style="animation:pulse 1.5s infinite"/><circle cx="380" cy="120" r="1.6" fill="#fff" style="animation:pulse 2s .5s infinite"/></g>
  <text x="24" y="62" class="t" font-size="24" font-weight="800" fill="#f1f5f9">Fatwa</text>
  <text x="24" y="88" class="t" font-size="13" font-weight="600" fill="#34d399" letter-spacing=".5">AGENCY LANDING PAGE</text>
  <text x="24" y="124" class="t" font-size="14" fill="#94a3b8">Fast, Arabic-first landing page for a</text><text x="24" y="145" class="t" font-size="14" fill="#94a3b8">certified recharge agency.</text>
  <rect x="24" y="178" width="48" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/><text x="48.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#34d399">HTML</text><rect x="80" y="178" width="41" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/><text x="100.5" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#34d399">CSS</text><rect x="129" y="178" width="41" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/><text x="149.5" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#34d399">RTL</text><rect x="178" y="178" width="92" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/><text x="224.0" y="194" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#34d399">Responsive</text>
  <circle cx="30" cy="226" r="5.5" fill="#e34c26"/><text x="42" y="230.5" class="t" font-size="13" fill="#cbd5e1">HTML</text>
  <text x="376" y="230.5" text-anchor="end" class="t" font-size="13" font-weight="600" fill="#34d399">View repo →</text>
</g>
<rect x=".75" y=".75" width="398.5" height="248.5" rx="19.5" fill="none" stroke="#34d399" stroke-opacity=".35" stroke-width="1.5"/>
</svg>