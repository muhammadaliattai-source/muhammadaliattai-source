<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Terminal introducing Mohamed Ali Attia next to an illustrated workspace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a17"/><stop offset=".55" stop-color="#0d1533"/><stop offset="1" stop-color="#190b30"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#16213f" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
<clipPath id="card"><rect width="1200" height="450" rx="28"/></clipPath></defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace}
  
  .fb{transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes dash{to{stroke-dashoffset:-48}}

  .eqb{transform-box:fill-box;transform-origin:center}
  @keyframes eq2{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  @keyframes code{0%,100%{opacity:.85}50%{opacity:.35}}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}
  @keyframes key{0%,90%,100%{fill:#64748b}93%{fill:#22d3ee}}
  @keyframes c0{0%,3.75%{transform:translateX(0)}7.94%,100%{transform:translateX(75px)}}@keyframes o0{0%,3.45%{opacity:0}3.75%,93%{opacity:1}97%,100%{opacity:0}}@keyframes o1{0%,9.50%{opacity:0;transform:translateX(-6px)}11.00%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}@keyframes c2{0%,12.31%{transform:translateX(0)}21.31%,100%{transform:translateX(187px)}}@keyframes o2{0%,12.01%{opacity:0}12.31%,93%{opacity:1}97%,100%{opacity:0}}@keyframes o3{0%,22.88%{opacity:0;transform:translateX(-6px)}24.38%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}@keyframes c4{0%,25.69%{transform:translateX(0)}35.13%,100%{transform:translateX(198px)}}@keyframes o4{0%,25.39%{opacity:0}25.69%,93%{opacity:1}97%,100%{opacity:0}}@keyframes o5{0%,36.69%{opacity:0;transform:translateX(-6px)}38.19%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}@keyframes c6{0%,39.50%{transform:translateX(0)}45.88%,100%{transform:translateX(126px)}}@keyframes o6{0%,39.20%{opacity:0}39.50%,93%{opacity:1}97%,100%{opacity:0}}@keyframes o7{0%,47.44%{opacity:0;transform:translateX(-6px)}48.94%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}@keyframes c8{0%,50.25%{transform:translateX(0)}56.19%,100%{transform:translateX(116px)}}@keyframes o8{0%,49.95%{opacity:0}50.25%,93%{opacity:1}97%,100%{opacity:0}}@keyframes o9{0%,57.75%{opacity:0;transform:translateX(-6px)}59.25%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}@keyframes of{0%,60.56%{opacity:0}61.06%,93%{opacity:1}97%,100%{opacity:0}}
</style>
