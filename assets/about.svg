 fill="#64748b">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">ls ./skills</tspan></text><rect x="211" y="268" width="156" height="24" fill="#0a1020" style="animation:c6 16.0s linear infinite"/></g><text x="50" y="313" class="m" font-size="16" style="animation:o7 16.0s linear infinite"><tspan fill="#475569">→ </tspan><tspan fill="#34d399">network-security  ccna  ccnp  linux  windows</tspan></text><g style="animation:o8 16.0s linear infinite"><text x="50" y="346" class="m" font-size="16"><tspan fill="#34d399">mohamed@egypt</tspan><tspan fill="#64748b">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">echo $GOAL</tspan></text><rect x="211" y="329" width="146" height="24" fill="#0a1020" style="animation:c8 16.0s linear infinite"/></g><text x="50" y="374" class="m" font-size="16" style="animation:o9 16.0s linear infinite"><tspan fill="#475569">→ </tspan><tspan fill="#fbbf24">Secure networks. Smooth operations. Useful apps.</tspan></text><g style="animation:of 16.0s linear infinite"><text x="50" y="407" class="m" font-size="16"><tspan fill="#34d399">mohamed@egypt</tspan><tspan fill="#64748b">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#64748b">$</tspan></text><rect x="213" y="392" width="9" height="19" fill="#22d3ee" style="animation:blink 1s steps(1) infinite"/></g>
  
