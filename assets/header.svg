<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Mohamed Ali Attia — Communications &amp; Technology Engineering student, network security, operations">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a17"/><stop offset=".55" stop-color="#0d1533"/><stop offset="1" stop-color="#190b30"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#16213f" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
</defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace}
  
  .fb{transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes dash{to{stroke-dashoffset:-48}}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scan{0%{transform:translateY(-60px);opacity:0}20%,80%{opacity:.9}100%{transform:translateY(60px);opacity:0}}
  @keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
</style>
